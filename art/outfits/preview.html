<!doctype html><meta charset="utf-8"><title>Rive wardrobe verification</title>
<style>body{margin:0;background:#efede8;font:16px system-ui}header{padding:10px;display:flex;gap:20px}main{display:flex}canvas{width:400px;height:640px}label{display:flex;gap:6px}#status{padding:8px}</style>
<header><label>Outfit <select id="outfit"><option value="0">Business</option><option value="1">Suit trousers</option><option value="2">Casual</option><option value="3">Skirt suit</option><option value="4">Casual shorts</option></select></label><label>Appearance <select id="appearance"><option value="0">Corporate</option><option value="0.5">Half</option><option value="1">Anime</option></select></label><label>Action <select id="action"><option value="">Idle</option><option value="Walking">Walk</option><option value="Talking">Talk</option><option value="Arm Wave">Wave</option></select></label></header>
<main><canvas id="man" width="400" height="640"></canvas><canvas id="woman" width="400" height="640"></canvas></main><div id="status">Loading</div>
<script>window.addEventListener('error',e=>document.querySelector('#status').textContent=e.message);window.addEventListener('unhandledrejection',e=>document.querySelector('#status').textContent=String(e.reason));</script>
<script src="../../node_modules/@rive-app/canvas/rive.js"></script>
<script type="module">
const {Rive,Layout,Fit,Alignment,RuntimeLoader}=window.rive;
RuntimeLoader.setWasmUrl('../../node_modules/@rive-app/canvas/rive.wasm');
document.querySelector('#status').textContent='Runtime imported';
const instances=[];
const outfit=document.querySelector('#outfit'),appearance=document.querySelector('#appearance'),action=document.querySelector('#action'),status=document.querySelector('#status');
function update(){instances.forEach((r)=>{r.viewModelInstance.number('outfitId').value=r.canvas.id==='man' && Number(outfit.value)>2 ? 0 : Number(outfit.value);r.viewModelInstance.number('numberProperty').value=Number(appearance.value);r.stop(['Talking','Arm Wave','Walking']);if(action.value)r.play(action.value);});status.textContent=`Loaded ${instances.length} characters; outfit ${outfit.value}; appearance ${appearance.value}; ${action.value||'Idle'}`;}
for(const sex of ['man','woman']){const r=new Rive({src:'../rive-revisions/transparent-backgrounds/generic_man_-_compliance_training.riv',canvas:document.querySelector('#'+sex),artboard:'generic-'+sex,stateMachines:'State Machine 1',autoplay:true,autoBind:false,layout:new Layout({fit:Fit.Contain,alignment:Alignment.BottomCenter}),onLoad(){const vm=r.viewModelByName('CharacterData');r.bindViewModelInstance(vm.instanceByName(sex==='man'?'Instance':'Instance 1'));instances.push(r);update();},onLoadError(e){status.textContent=JSON.stringify(e);}});}
[outfit,appearance,action].forEach(el=>el.addEventListener('change',update));
</script>
